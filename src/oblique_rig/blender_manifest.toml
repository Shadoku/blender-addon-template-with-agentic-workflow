schema_version = "1.0.0"

# Unique identifier; must match this directory's name. Lowercase, underscores.
id = "oblique_rig"
version = "0.3.0"
name = "Oblique Rig"
tagline = "Build a 2:1 oblique projection rig for pixel art guides"
maintainer = "Shadoku <shadoku@gmail.com>"
type = "add-on"

# Supported Blender range. 4.5 LTS and 5.2 LTS are what CI runs.
blender_version_min = "4.5.0"

# SPDX identifiers; add-ons that import bpy and are distributed must be GPL-compatible.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Shadoku"]

# Optional: website = "https://example.com/oblique_rig"
# Optional: tags = ["Object"]  (must come from Blender's fixed tag list)
# Optional: platforms = ["windows-x64", "macos-arm64", "linux-x64"]
# Optional: wheels = ["./wheels/some_dep-1.0-py3-none-any.whl"]

# Declare what the add-on needs; tools/lint_addon.py checks imports against this.
# Render Guides / Render Turnaround write PNG files to the folder set in the panel.
[permissions]
files = "Write guide renders to the chosen output folder"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "*.pyc",
]
